name: Run sdc11073 consumer against ri provider

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        sdc11073_repo: [draegerwerk/sdc11073]
        sdcpi_branch: [feature/pat_20_wait_for_hellos]
        tls_enable: [true, false]
        include:
          - sdc11073_repo: draegerwerk/sdc11073
            sdc11073_branch: v3.0.0
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Checkout sdc11073
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.sdc11073_repo }}
          ref: ${{ matrix.sdc11073_branch }}
          path: sdc11073_git

      - name: Install sdc11073
        run: |
          python -m pip install -e ./sdc11073_git

      - name: Checkout sdpi
        run: |
          git clone --branch=${{ matrix.sdcpi_branch }} https://gitlab.com/a-kleinf/sdpi.git sdpi_git

      - name: Run test
        run: |
          ./sdc11073_consumer.sh ${{ matrix.tls_enable }}
